[package]
name = "moment-ocr"
version = "0.3.4"
description = "A Tauri 2.0 React application"
authors = ["you"]
edition = "2021"

[lib]
name = "moment_ocr_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# 解压 unix 的 python-build-standalone 归档（tar.gz）；Windows 上只有测试会用到
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
urlencoding = "2"
rfd = "0.14"
arboard = "3"
screenshots = "0.8"
chrono = "0.4"
once_cell = "1"
dirs = "5"
jpeg-encoder = { version = "0.6", features = ["simd"] }
# loopback 推理通道的每启动随机 token（审计 run-1: loopback-llama-server-no-peer-auth）
rand = "0.8"
# 下载件 sha256 完整性校验（审计 run-1: 下载-执行链无独立完整性绑定）
sha2 = "0.10"

# 依赖不产出调试符号：显著缩小构建体积、加快链接；代价是无法单步进入依赖代码
[profile.dev.package."*"]
debug = false

# macOS 覆盖层窗口要盖住菜单栏（NSWindow setLevel），tao 的 always_on_top 层级不够
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    # DXGI Desktop Duplication 抓屏（比 GDI BitBlt 快一个数量级）
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
