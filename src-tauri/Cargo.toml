[package]
name = "moment-ocr"
version = "0.2.0"
description = "A Tauri 2.0 React application"
authors = ["you"]
edition = "2021"

[lib]
name = "moment_ocr_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
screenshots = "0.8"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
# 解压 unix 的 python-build-standalone 归档（tar.gz）；Windows 上只有测试会用到
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
urlencoding = "2"
once_cell = "1"
dirs = "5"
rfd = "0.14"

# 依赖不产出调试符号：显著缩小构建体积、加快链接；代价是无法单步进入依赖代码
[profile.dev.package."*"]
debug = false
