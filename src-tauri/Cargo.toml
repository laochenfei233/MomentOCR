[package]
name = "moment-ocr"
version = "0.1.0"
description = "A Tauri 2.0 React application"
authors = ["you"]
edition = "2021"

[lib]
name = "moment_ocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
screenshots = "0.8"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
