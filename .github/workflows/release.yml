name: Release

on:
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
  # 推送 v* 标签时自动触发，例如 v0.2.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    env:
      # 覆盖层必须按目标架构打包：arm64 机器上给 Intel 包打出 arm64 覆盖层，用户会看到 CPU 不匹配
      MOMENTOCR_OVERLAY_ARCH: ${{ matrix.overlay_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            overlay_arch: x86_64
            label: windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            overlay_arch: x86_64
            label: linux-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            overlay_arch: arm64
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            overlay_arch: x86_64
            label: macos-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # 自带覆盖层里的 PyQt5 需要这些运行时库：PyInstaller 分析要 libGL 系列，
          # linuxdeploy 打 AppImage 时还要能解析 Qt 的 xcb 依赖，
          # 否则报 "Could not find dependency: libxcb-icccm.so.4" 直接失败
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev \
            rpm \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxcb-shape0 \
            libxcb-util1 \
            libxcb-cursor0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      # 每个平台各打一份自带运行时的截图覆盖层（PyInstaller 不能交叉编译）
      - name: Setup Python
        if: matrix.target != 'x86_64-apple-darwin'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Intel mac 目标跑在 arm64 runner 上，覆盖层也必须编成 x86_64，否则在 Intel 机上跑不了
      - name: Setup Python (x64 for Intel mac)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      # arm64 runner 上出 Intel 包：必须让工具链真的按 x86_64 跑，
      # 否则 pip 会装 arm64 的 PyQt5 wheel、PyInstaller 也产出 arm64 覆盖层
      - name: Install Rosetta (Intel mac target)
        if: matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Install overlay packaging tools
        shell: bash
        run: |
          PY="python"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then PY="arch -x86_64 python"; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install pyinstaller PyQt5
          $PY -c "import platform,sys; print('工具链架构:', platform.machine(), sys.version.split()[0])"

      - name: Install frontend dependencies
        run: npm ci

      # 单独一步准备覆盖层：失败时把原因写进 check-run 注解。
      # 构建步骤的日志需要仓库管理员权限才能读，注解不需要，出问题能第一时间看到原因。
      - name: Prepare bundled overlay
        shell: bash
        run: |
          if ! node scripts/prepare-overlay.mjs > overlay-build.log 2>&1; then
            detail=$(tail -c 1500 overlay-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
            echo "::error title=overlay packaging failed::$detail"
            tail -40 overlay-build.log
            exit 1
          fi
          if [ ! -f src-tauri/binaries/screenshot_overlay/screenshot_overlay ] \
             && [ ! -f src-tauri/binaries/screenshot_overlay/screenshot_overlay.exe ]; then
            echo "::error title=overlay artifact missing::脚本退出成功但没有产物，检查 build-overlay.py"
            exit 1
          fi
          du -sh src-tauri/binaries/screenshot_overlay

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # runner 上可能没有 libfuse2，让 linuxdeploy 自解压运行而不是挂载
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v__VERSION__
          releaseName: 须臾OCR v__VERSION__
          releaseBody: |
            ## 须臾OCR v__VERSION__

            下载对应平台的安装包：

            | 平台 | 文件 |
            | --- | --- |
            | Windows | `MomentOCR_*_x64-setup.exe`（NSIS，默认安装到 Program Files）/ `MomentOCR_*_x64_zh-CN.msi` |
            | macOS | `.dmg`（Apple Silicon 与 Intel 各一个） |
            | Linux | `.AppImage` / `.deb` / `.rpm` |

            > macOS 安装包未做代码签名，首次打开需在「系统设置 → 隐私与安全性」中点击「仍要打开」。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --verbose
